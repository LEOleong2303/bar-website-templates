<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>SAMPLE BAR 管理酒單</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />
<style>
      :root{
        --bg:#0b0906;
        --panel:#171310;
        --panel-2:#201a14;
        --line:#322a1f;
        --line-soft:#241d15;
        --gold:#e3c078;
        --gold-deep:#b8934a;
        --gold-ink:#1a1409;
        --cream:#f5efe0;
        --muted:#b8ab8f;
        --faint:#8a7d63;
        --ok:#9dc08b;
        --radius:14px;
      }
      *{ box-sizing:border-box; }
      html{ -webkit-text-size-adjust:100%; }
      body{
        margin:0;
        background:var(--bg);
        color:var(--cream);
        font-family:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
        line-height:1.55;
        padding-bottom:env(safe-area-inset-bottom);
      }
      button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
      button, [role="button"], select, input, textarea{ min-height:2.75rem; }
      :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

      .wrap{ max-width:880px; margin:0 auto; padding:0 16px; }

      /* ---------- view switch ---------- */
      .viewbar{
        position:sticky; top:0; z-index:40;
        background:rgba(11,9,6,.94);
        backdrop-filter:blur(8px);
        border-bottom:1px solid var(--line-soft);
      }
      .viewbar-inner{ display:flex; align-items:center; gap:12px; padding-top:10px; padding-bottom:10px; }
      .brand{ font-family:"Noto Serif TC", serif; font-weight:900; letter-spacing:.14em; font-size:15px; white-space:nowrap; }
      .brand small{ display:block; font-family:"Noto Sans TC",sans-serif; font-weight:500; letter-spacing:.32em; font-size:9px; color:var(--gold); }
      .seg{ margin-left:auto; display:flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px; }
      .seg button{
        min-height:2.5rem; padding:0 16px; border-radius:999px; font-weight:700; font-size:14px; color:var(--muted);
        display:inline-flex; align-items:center; gap:7px;
      }
      .seg button[aria-pressed="true"]{ background:var(--gold); color:var(--gold-ink); }
      .seg .dot{
        min-width:20px; height:20px; padding:0 5px; border-radius:999px;
        background:#8c2f22; color:#fff; font-size:12px; font-weight:700;
        display:none; align-items:center; justify-content:center; line-height:1;
      }
      .seg button[aria-pressed="true"] .dot{ background:var(--gold-ink); color:var(--gold); }
      .seg .dot.show{ display:inline-flex; }

      /* ---------- guest intro ---------- */
      .intro{ padding:18px 0 4px; }
      .intro h1{ font-family:"Noto Serif TC",serif; font-size:24px; font-weight:900; margin:0 0 4px; letter-spacing:.02em; }
      .intro p{ margin:0; color:var(--muted); font-size:14px; }
      .cover{
        display:block; width:100%; height:190px; object-fit:cover; object-position:center 62%;
        border-radius:var(--radius); border:1px solid var(--line); margin-top:14px;
      }
      @media (min-width:700px){ .cover{ height:240px; } }

      /* ---------- category tabs ---------- */
      .catbar{ display:flex; flex-wrap:wrap; gap:8px; padding:14px 0 6px; }
      .catbar button{
        min-height:2.5rem; padding:0 14px; border:1px solid var(--line); border-radius:999px;
        color:var(--muted); font-size:14px; font-weight:500; background:var(--panel);
      }
      .catbar button[aria-selected="true"]{ border-color:var(--gold); color:var(--gold); font-weight:700; background:var(--panel-2); }

      .cat-title{ display:flex; align-items:baseline; gap:10px; margin:18px 0 2px; }
      .cat-title h2{ font-family:"Noto Serif TC",serif; font-size:20px; font-weight:700; margin:0; }
      .cat-title span{ color:var(--faint); font-size:12px; letter-spacing:.18em; }

      /* ---------- menu items ---------- */
      .items{ list-style:none; margin:0; padding:0; }
      .item{
        display:grid; grid-template-columns:76px 1fr auto; gap:6px 14px;
        padding:13px 2px; border-bottom:1px solid var(--line-soft); align-items:center;
      }
      .item .thumb{
        width:76px; height:96px; object-fit:cover; display:block;
        border-radius:10px; border:1px solid var(--line-soft); background:var(--panel-2);
      }
      .item .nm{ font-family:"Noto Serif TC",serif; font-size:16.5px; font-weight:600; }
      .item .sub{ color:var(--faint); font-size:12.5px; margin-top:1px; }
      .item .ctl{ display:flex; align-items:center; gap:10px; grid-row:span 1; }
      .price{ color:var(--gold); font-weight:700; font-size:16px; white-space:nowrap; min-width:52px; text-align:right; }
      .price small{ font-size:11px; color:var(--faint); font-weight:500; }
      .addbtn{
        width:44px; height:44px; min-height:44px; border-radius:50%;
        border:1.5px solid var(--gold); color:var(--gold);
        font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center;
      }
      .addbtn:active{ background:var(--gold); color:var(--gold-ink); }
      .addbtn.gone{ display:none; }
      .stepper{ display:none; align-items:center; gap:2px; border:1.5px solid var(--gold); border-radius:999px; padding:2px; }
      .stepper.on{ display:inline-flex; }
      .stepper button{ width:38px; height:38px; min-height:38px; border-radius:50%; font-size:20px; color:var(--gold); display:flex; align-items:center; justify-content:center; }
      .stepper .q{ min-width:26px; text-align:center; font-weight:700; font-size:16px; }
      .asktag{ color:var(--faint); font-size:13px; border:1px dashed var(--line); border-radius:999px; padding:8px 12px; white-space:nowrap; }

      .foot-note{ color:var(--faint); font-size:12.5px; text-align:center; padding:26px 0 110px; margin:0; }

      /* ---------- cart bar ---------- */
      .cartbar{
        position:fixed; left:0; right:0; bottom:0; z-index:50;
        padding:10px 16px calc(10px + env(safe-area-inset-bottom));
        background:rgba(11,9,6,.96); border-top:1px solid var(--line);
        display:none;
      }
      .cartbar.show{ display:block; }
      .cartbar-inner{ max-width:880px; margin:0 auto; display:flex; align-items:center; gap:14px; }
      .cartbar .sum{ font-size:14px; color:var(--muted); }
      .cartbar .sum b{ color:var(--cream); font-size:17px; }
      .cartbar .sum .amt{ color:var(--gold); font-weight:700; font-size:17px; margin-left:8px; }
      .btn-gold{
        margin-left:auto; background:var(--gold); color:var(--gold-ink);
        font-weight:700; font-size:15.5px; border-radius:12px; padding:0 22px; min-height:3rem;
        display:inline-flex; align-items:center; justify-content:center; gap:8px;
      }
      .btn-gold:disabled{ opacity:.45; cursor:not-allowed; }
      .btn-ghost{
        border:1px solid var(--line); color:var(--cream); border-radius:12px; padding:0 18px; min-height:3rem;
        font-weight:500; display:inline-flex; align-items:center; justify-content:center;
      }

      /* ---------- sheet (cart / confirm) ---------- */
      .scrim{
        position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.66);
        display:none; align-items:flex-end; justify-content:center;
      }
      .scrim.open{ display:flex; }
      .sheet{
        background:var(--panel); width:100%; max-width:640px; max-height:92dvh; overflow-y:auto;
        border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
        padding:20px 20px calc(20px + env(safe-area-inset-bottom));
      }
      @media (min-width:700px){
        .scrim{ align-items:center; padding:24px; }
        .sheet{ border-radius:20px; border-bottom:1px solid var(--line); }
      }
      .sheet h2{ font-family:"Noto Serif TC",serif; margin:0 0 2px; font-size:21px; }
      .sheet .sub2{ color:var(--muted); font-size:13.5px; margin:0 0 14px; }
      .sheet .x{ float:right; width:40px; height:40px; min-height:40px; border-radius:50%; border:1px solid var(--line); color:var(--muted); font-size:17px; }
      .cartline{ display:grid; grid-template-columns:52px 1fr auto; gap:4px 12px; padding:11px 0; border-bottom:1px solid var(--line-soft); align-items:center; }
      .cartline .cthumb{
        width:52px; height:64px; object-fit:cover; display:block;
        border-radius:8px; border:1px solid var(--line-soft); background:var(--panel-2);
      }
      .cartline .nm{ font-weight:600; font-size:15.5px; }
      .cartline .up{ color:var(--faint); font-size:12.5px; }
      .cartline .lt{ color:var(--gold); font-weight:700; text-align:right; }
      .cartline .stepper{ display:inline-flex; }
      .cart-total{ display:flex; justify-content:space-between; align-items:baseline; padding:14px 0 4px; font-size:15px; }
      .cart-total b{ color:var(--gold); font-size:21px; }
      .cart-total small{ color:var(--faint); display:block; font-size:12px; margin-top:2px; }

      .seat-label{ font-weight:700; font-size:15px; margin:18px 0 8px; }
      .seats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
      .seats button{
        min-height:3.4rem; border:1px solid var(--line); border-radius:12px; background:var(--panel-2);
        font-size:16px; font-weight:600; color:var(--muted);
      }
      .seats button[aria-pressed="true"]{ border-color:var(--gold); color:var(--gold-ink); background:var(--gold); font-weight:700; }
      .seats button small{ display:block; font-size:11px; font-weight:500; letter-spacing:.2em; }
      .seat-group{ font-weight:700; font-size:13px; color:var(--gold); letter-spacing:.22em; margin:16px 0 8px; }
      .seat-group:first-child{ margin-top:2px; }

      .note-input{
        width:100%; margin-top:14px; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
        color:var(--cream); padding:12px 14px; font:inherit; font-size:15px; resize:vertical; min-height:3rem;
      }
      .note-input::placeholder{ color:var(--faint); }
      .sheet .actions{ display:flex; gap:10px; margin-top:18px; }
      .sheet .actions .btn-gold{ margin-left:0; flex:1; }
      .err{ color:#e08a7a; font-size:13.5px; margin:10px 0 0; display:none; }
      .err.show{ display:block; }

      /* confirm */
      .confirm{ text-align:center; padding:8px 0 4px; }
      .confirm .tick{
        width:64px; height:64px; margin:6px auto 14px; border-radius:50%;
        border:2px solid var(--ok); color:var(--ok); font-size:32px;
        display:flex; align-items:center; justify-content:center;
      }
      .confirm h2{ font-size:23px; }
      .confirm .ono{ color:var(--gold); font-family:"Noto Serif TC",serif; font-size:30px; font-weight:900; letter-spacing:.06em; margin:6px 0 2px; }
      .confirm p{ color:var(--muted); font-size:14.5px; margin:4px 0; }
      .confirm .receipt{
        text-align:left; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:12px;
        padding:12px 16px; margin:16px 0; font-size:14.5px;
      }
      .confirm .receipt div{ display:flex; justify-content:space-between; padding:3px 0; }
      .confirm .receipt .rl{ align-items:center; gap:10px; }
      .confirm .receipt .rl > span:first-child{ flex:1; }
      .confirm .receipt .rthumb{
        width:34px; height:42px; object-fit:cover; flex:none;
        border-radius:6px; border:1px solid var(--line-soft); background:var(--panel);
      }
      .confirm .receipt .tot{ border-top:1px solid var(--line); margin-top:8px; padding-top:9px; font-weight:700; }
      .confirm .receipt .tot span:last-child{ color:var(--gold); }
      .confirm .actions{ display:flex; gap:10px; }
      .confirm .actions button{ flex:1; }

      /* ---------- bar view ---------- */
      .bar-head{ display:flex; align-items:center; gap:12px; padding:18px 0 4px; flex-wrap:wrap; }
      .bar-head h1{ font-family:"Noto Serif TC",serif; font-size:24px; font-weight:900; margin:0; }
      .bar-head p{ width:100%; margin:0; color:var(--muted); font-size:14px; }
      .bell{
        margin-left:auto; border:1px solid var(--line); border-radius:999px; padding:0 14px; min-height:2.5rem;
        color:var(--muted); font-size:13.5px; display:inline-flex; align-items:center; gap:7px;
      }
      .bell[aria-pressed="true"]{ border-color:var(--gold); color:var(--gold); }
      .empty{
        border:1px dashed var(--line); border-radius:var(--radius); color:var(--muted);
        text-align:center; padding:38px 20px; font-size:15px; margin-top:16px;
      }
      .empty b{ color:var(--cream); display:block; font-size:16.5px; margin-bottom:4px; }
      .order{
        background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
        padding:16px; margin-top:14px;
      }
      .order.fresh{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
      @media (prefers-reduced-motion: no-preference){
        .order.fresh{ animation:pulse 1.1s ease-in-out 3; }
        @keyframes pulse{ 50%{ box-shadow:0 0 0 5px rgba(227,192,120,.22); } }
      }
      .order .ohead{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
      .seat-badge{
        background:var(--gold); color:var(--gold-ink); border-radius:10px; font-weight:900;
        padding:7px 12px; font-size:16px; white-space:nowrap; line-height:1.25; text-align:center;
      }
      .seat-badge small{ display:block; font-size:10px; font-weight:700; letter-spacing:.24em; }
      .order .ono2{ font-family:"Noto Serif TC",serif; font-weight:700; font-size:17px; }
      .order .otime{ color:var(--faint); font-size:13px; }
      .status-tag{ margin-left:auto; font-size:12.5px; font-weight:700; border-radius:999px; padding:5px 11px; }
      .st-new{ background:#8c2f22; color:#ffd9d2; }
      .st-making{ background:#5c4a17; color:#f3d98b; }
      .st-done{ background:#2c4423; color:#bfe3ae; }
      .order ul{ list-style:none; margin:12px 0 0; padding:12px 0 0; border-top:1px solid var(--line-soft); }
      .order li{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:3.5px 0; font-size:15.5px; }
      .order li .lft{ display:flex; align-items:center; gap:10px; min-width:0; }
      .order li .othumb{
        width:38px; height:48px; object-fit:cover; flex:none;
        border-radius:6px; border:1px solid var(--line-soft); background:var(--panel-2);
      }
      .order li .q{ color:var(--gold); font-weight:700; white-space:nowrap; }
      .order .onote{
        margin-top:10px; background:var(--panel-2); border-radius:10px; padding:9px 12px;
        font-size:14px; color:var(--cream);
      }
      .order .onote span{ color:var(--gold); font-weight:700; margin-right:6px; }
      .order .ofoot{ display:flex; align-items:center; gap:10px; margin-top:14px; }
      .order .ototal{ font-size:15px; color:var(--muted); }
      .order .ototal b{ color:var(--gold); font-size:18px; }
      .order .ofoot .btn-gold, .order .ofoot .btn-ghost{ margin-left:0; min-height:2.9rem; }
      .order .ofoot .spacer{ flex:1; }
      /* ---------- PIN gate ---------- */
      .pin-dots{ display:flex; justify-content:center; gap:14px; margin:20px 0 6px; }
      .pin-dot{
        width:15px; height:15px; border-radius:50%;
        border:1.5px solid var(--gold-deep); background:transparent;
      }
      .pin-dot.on{ background:var(--gold); border-color:var(--gold); }
      .pin-err{ color:#e08a7a; font-size:13.5px; text-align:center; min-height:1.4em; margin:6px 0 2px; }
      .pinpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:300px; margin:10px auto 2px; }
      .pinpad button{
        min-height:3.6rem; border:1px solid var(--line); border-radius:14px; background:var(--panel-2);
        font-size:22px; font-weight:600; color:var(--cream);
      }
      .pinpad button:active{ border-color:var(--gold); color:var(--gold); }
      .pinpad button.util{ font-size:15px; color:var(--muted); }
      @media (prefers-reduced-motion: no-preference){
        .pin-shake{ animation:pinshake .4s ease-in-out; }
        @keyframes pinshake{ 20%,60%{ transform:translateX(-7px); } 40%,80%{ transform:translateX(7px); } }
      }

      .done-sec h2{ font-family:"Noto Serif TC",serif; font-size:18px; margin:28px 0 0; color:var(--muted); }
      .order.done{ opacity:.62; }
      .demo-line{ color:var(--faint); font-size:12.5px; text-align:center; padding:22px 0 40px; margin:0; }
      .hidden{ display:none !important; }
    
      /* ---------- admin ---------- */
      .admin-row{ display:grid; grid-template-columns:76px 1fr; gap:12px; padding:14px 2px; border-bottom:1px solid var(--line-soft); align-items:start; }
      .admin-row .fields{ display:grid; gap:8px; }
      .admin-row input, .admin-row select{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; color:var(--cream); padding:10px 12px; font:inherit; font-size:15px; min-height:2.75rem; }
      .admin-row .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .btn-danger{ border:1px solid #8c2f22; color:#e08a7a; border-radius:12px; padding:0 16px; min-height:2.9rem; font-weight:700; }
      .savebar{ position:sticky; bottom:0; background:rgba(11,9,6,.96); border-top:1px solid var(--line); padding:12px 0 calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center; margin-top:20px; }
      .save-msg{ font-size:14px; }
      .save-msg.ok{ color:var(--ok); }
      .save-msg.err{ color:#e08a7a; }
      .add-form{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-top:18px; }
      .add-form h2{ font-family:"Noto Serif TC",serif; font-size:18px; margin:0 0 10px; }
      .add-form .grid{ display:grid; gap:8px; }
      .add-form input, .add-form select{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; color:var(--cream); padding:10px 12px; font:inherit; font-size:15px; min-height:2.75rem; }
      .add-form .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    </style>
  </head>
  <body>
    <div class="viewbar">
      <div class="wrap viewbar-inner">
        <div class="brand">範例酒吧<small>SAMPLE BAR</small></div>
        <div class="seg" role="group" aria-label="管理">
          <button type="button" id="btn-back">返去點餐頁</button>
          <button type="button" id="lock-admin">鎖定</button>
        </div>
      </div>
    </div>

    <main id="admin-view" class="hidden">
      <div class="wrap">
        <div class="intro">
          <h1>管理酒單</h1>
          <p>改名、價錢、分類、相片，撳「儲存酒單」即刻生效，客人畫面即刻見到。加新飲品：填好資料撳「加飲品」；相片要先上載去伺服器嘅 assets/img/ 再喺度揀。</p>
        </div>
        <nav class="catbar" id="catbar" aria-label="酒單分類"></nav>
        <section id="admin-list" aria-live="polite"></section>
        <div class="add-form">
          <h2>加新飲品</h2>
          <div class="grid">
            <input type="text" id="add-name" placeholder="飲品名（例如：青檸特調）" />
            <input type="text" id="add-sub" placeholder="副標題（可留空，例如 500ML / 杯售）" />
            <input type="text" id="add-ing" placeholder="英文成份（可留空，例如 Rum · Cola · Lime）" />
            <div class="row2">
              <input type="number" id="add-price" min="0" step="1" placeholder="價錢（留空 = 面議）" />
              <select id="add-cat"></select>
            </div>
            <select id="add-img"></select>
            <button type="button" class="btn-gold" id="add-drink" style="margin-left:0">加飲品</button>
          </div>
        </div>
        <div class="savebar">
          <button type="button" class="btn-gold" id="save-menu" style="flex:1">儲存酒單</button>
          <span class="save-msg" id="save-msg"></span>
        </div>
        <p class="foot-note">改完記得撳「儲存酒單」。未儲存就離開，改動唔會生效。</p>
      </div>
    </main>

    <!-- bar PIN gate -->
    <div class="scrim open" id="gate-scrim">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gate-title" id="gate-sheet">
        <button type="button" class="x" id="gate-close" aria-label="關閉">✕</button>
        <h2 id="gate-title">管理酒單</h2>
        <p class="sub2">只供同事使用，請輸入 4 位 PIN。</p>
        <div class="pin-dots" id="pin-dots" aria-hidden="true">
          <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <p class="pin-err" id="pin-err" role="alert"></p>
        <div class="pinpad" id="pinpad">
          <button type="button" data-pin="1">1</button>
          <button type="button" data-pin="2">2</button>
          <button type="button" data-pin="3">3</button>
          <button type="button" data-pin="4">4</button>
          <button type="button" data-pin="5">5</button>
          <button type="button" data-pin="6">6</button>
          <button type="button" data-pin="7">7</button>
          <button type="button" data-pin="8">8</button>
          <button type="button" data-pin="9">9</button>
          <button type="button" class="util" id="pin-cancel">取消</button>
          <button type="button" data-pin="0">0</button>
          <button type="button" class="util" id="pin-del" aria-label="刪除一位">⌫</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      var CATS = [
        { id:"cocktail", name:"雞尾酒", en:"COCKTAILS" },
        { id:"draft",    name:"精釀啤酒", en:"ON TAP" },
        { id:"whisky",   name:"威士忌", en:"WHISKY" },
        { id:"special",  name:"基酒特調", en:"HOUSE MIX" },
        { id:"zero",     name:"無酒精特飲", en:"ZERO PROOF" },
        { id:"sparkling", name:"氣泡特飲", en:"SPARKLING" },
        { id:"cans",     name:"環球特選啤酒", en:"BEERS" },
        { id:"wine",     name:"紅酒", en:"WINE" },
        { id:"shisha",   name:"Shisha", en:"SHISHA" }
      ];
      var PHOTOS = ["aperol-spritz", "b52", "blackcurrant-special", "blue-hawaii", "chardonnay", "cognac-vsop", "cognac-vsop-bottle", "cold-pressed-pineapple", "cuba-libre", "da-ning-le", "draft-double-ipa", "draft-fruit-sour", "draft-lager-classic", "draft-lager-pale", "draft-mango-sour", "draft-matcha", "draft-peach-sour", "fresh-lemon-juice", "gin-fizz", "gin-sour", "gin-tonic", "godfather", "golden-ale", "grapefruit-coriander", "herbal-liqueur", "highball", "honey-orchid", "hot-lemon-tea", "house-special-1", "house-special-2", "house-special-3", "house-special-4", "house-special-5", "house-wine", "jackfruit-salt", "lager-beer", "lemon-honey-yuzu-tea", "lemon-mint-soda", "lemon-plum-high", "lemon-special", "lemongrass-vinegar", "long-island", "long-island-3l", "longan-coconut", "mango-gose", "mangosteen-juice", "margarita", "millionaire", "mojito", "mulled-red-wine", "nanyang-pineapple", "olive-cider", "orange-burst", "orange-soda", "orange-special", "pineapple-sour", "pineapple-special", "plum-pineapple-sparkler", "pomelo-special", "riesling", "sauvignon-blanc", "screwdriver", "sea-salt-gose", "shisha", "single-malt-12", "single-malt-12-sherry", "single-malt-15", "single-malt-15-sherry", "single-malt-18", "single-malt-taiwan", "soda-mojito", "sparkling-lemon", "starfruit-gose", "stout-beer", "sunset-zero-proof", "tailor-made", "tequila-sunrise", "tequila-sunrise-3l", "thai-mojito", "triple-ipa", "whisky-sour"];
      var MENU = [];
      var curCat = "cocktail";
      var authed = false;

      function $(id){ return document.getElementById(id); }
      function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
      function apiGet(action){
        return fetch("api.php?action=" + action).then(function(r){
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        });
      }
      function apiPost(action, body){
        return fetch("api.php?action=" + action, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {})
        }).then(function(r){
          return r.json().catch(function(){ return {}; }).then(function(d){
            if (!r.ok) throw new Error((d && d.error) || ("HTTP " + r.status));
            return d;
          });
        });
      }
      function thumbHtml(name, img, cls){
        if (img) return '<img class="' + cls + '" src="' + img + '" alt="' + esc(name) + '" decoding="async" />';
        return '<span class="' + cls + ' thumb-ph">' + esc(name.charAt(0)) + '</span>';
      }
      function catName(id){
        for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].name;
        return id;
      }
      function photoOptions(selected){
        var h = '<option value="">無相片</option>';
        PHOTOS.forEach(function(p){
          var v = "assets/img/" + p + ".jpg";
          h += '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + p + '</option>';
        });
        return h;
      }

      /* ===== 分類 + 列表 ===== */
      function renderCats(){
        var bar = $("catbar"); bar.innerHTML = "";
        CATS.forEach(function(c){
          var b = document.createElement("button");
          b.type = "button"; b.textContent = c.name;
          b.setAttribute("aria-selected", c.id === curCat ? "true" : "false");
          b.addEventListener("click", function(){ curCat = c.id; renderCats(); renderAdmin(); });
          bar.appendChild(b);
        });
      }
      function renderAdmin(){
        var list = $("admin-list");
        var html = "";
        MENU.filter(function(m){ return m.category === curCat; }).forEach(function(m){
          html += '<div class="admin-row" data-id="' + m.id + '">' + thumbHtml(m.name, m.img, "thumb") +
            '<div class="fields">' +
            '<input type="text" data-f="name" value="' + esc(m.name) + '" placeholder="飲品名" />' +
            '<input type="text" data-f="sub" value="' + esc(m.sub || "") + '" placeholder="副標題（可留空，例如 500ML / 杯售）" />' +
            '<input type="text" data-f="ing" value="' + esc(m.ing || "") + '" placeholder="英文成份（可留空，例如 Rum · Cola · Lime）" />' +
            '<div class="row2">' +
              '<input type="number" data-f="price" min="0" step="1" value="' + (m.price === null ? "" : m.price) + '" placeholder="價錢（留空 = 面議）" />' +
              '<select data-f="category">' + CATS.map(function(c){ return '<option value="' + c.id + '"' + (c.id === m.category ? ' selected' : '') + '>' + c.name + '</option>'; }).join("") + '</select>' +
            '</div>' +
            '<div class="row2">' +
              '<select data-f="img">' + photoOptions(m.img || "") + '</select>' +
              '<button type="button" class="btn-danger" data-del="' + m.id + '">刪除</button>' +
            '</div>' +
            '</div></div>';
        });
        list.innerHTML = html || '<p class="empty">呢個分類未有飲品。</p>';
      }
      function findItem(id){
        for (var i = 0; i < MENU.length; i++) if (MENU[i].id === id) return MENU[i];
        return null;
      }
      $("admin-list").addEventListener("input", function(e){
        var t = e.target;
        if (!t.dataset || !t.dataset.f) return;
        var row = t.closest(".admin-row");
        if (!row) return;
        var m = findItem(row.getAttribute("data-id"));
        if (!m) return;
        var f = t.dataset.f;
        if (f === "price"){
          m.price = t.value === "" ? null : Math.max(0, parseInt(t.value, 10) || 0);
        } else if (f === "category"){
          m.category = t.value;
          m.category_name = catName(t.value);
        } else {
          m[f] = t.value;
        }
        setMsg("", "");
      });
      $("admin-list").addEventListener("click", function(e){
        var t = e.target;
        if (!t.dataset || !t.dataset.del) return;
        var m = findItem(t.dataset.del);
        if (!m) return;
        if (!confirm("確定刪除「" + m.name + "」？儲存之後先正式生效。")) return;
        MENU = MENU.filter(function(x){ return x.id !== m.id; });
        renderAdmin();
        setMsg("已刪除，記得撳「儲存酒單」。", "");
      });

      /* ===== 加新飲品 ===== */
      function fillAddForm(){
        $("add-cat").innerHTML = CATS.map(function(c){ return '<option value="' + c.id + '"' + (c.id === curCat ? ' selected' : '') + '>' + c.name + '</option>'; }).join("");
        $("add-img").innerHTML = photoOptions("");
      }
      $("add-drink").addEventListener("click", function(){
        var name = $("add-name").value.trim();
        if (!name){ setMsg("請填飲品名。", "err"); $("add-name").focus(); return; }
        var priceVal = $("add-price").value.trim();
        var cat = $("add-cat").value;
        var item = {
          id: "custom-" + Date.now().toString(36),
          name: name,
          sub: $("add-sub").value.trim(),
          ing: $("add-ing").value.trim(),
          price: priceVal === "" ? null : Math.max(0, parseInt(priceVal, 10) || 0),
          category: cat,
          category_name: catName(cat),
          img: $("add-img").value
        };
        if (!item.sub) delete item.sub;
        if (!item.ing) delete item.ing;
        MENU.push(item);
        $("add-name").value = ""; $("add-sub").value = ""; $("add-ing").value = ""; $("add-price").value = ""; $("add-img").value = "";
        curCat = cat; renderCats(); renderAdmin();
        setMsg("已加入「" + name + "」，記得撳「儲存酒單」。", "");
      });

      /* ===== 儲存 ===== */
      function setMsg(text, kind){
        var el = $("save-msg");
        el.textContent = text;
        el.className = "save-msg" + (kind ? " " + kind : "");
      }
      $("save-menu").addEventListener("click", function(){
        var btn = $("save-menu");
        btn.disabled = true;
        setMsg("儲存中…", "");
        apiPost("admin_save_menu", { menu: MENU }).then(function(d){
          btn.disabled = false;
          setMsg("已儲存（" + d.count + " 款），客人畫面即刻見到。", "ok");
          return apiGet("get_menu");
        }).then(function(d){
          if (d.ok && d.menu){ MENU = d.menu; renderAdmin(); }
        }).catch(function(err){
          btn.disabled = false;
          setMsg(err && err.message ? err.message : "儲存唔到，請再試。", "err");
        });
      });

      /* ===== PIN（由伺服器驗證） ===== */
      var pinEntry = "";
      var pinBusy = false;
      function renderPin(){
        var dots = $("pin-dots").children;
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < pinEntry.length);
      }
      function openGate(){
        pinEntry = ""; pinBusy = false;
        $("pin-err").textContent = ""; renderPin();
        $("admin-view").classList.add("hidden");
        $("gate-scrim").classList.add("open");
      }
      function closeGate(){ $("gate-scrim").classList.remove("open"); pinEntry = ""; renderPin(); }
      function showAdmin(){
        authed = true;
        closeGate();
        $("admin-view").classList.remove("hidden");
        loadMenu();
      }
      function pinFail(){
        pinEntry = ""; renderPin();
        $("pin-err").textContent = "PIN 唔啱，請再試一次。";
        var sh = $("gate-sheet");
        sh.classList.remove("pin-shake"); void sh.offsetWidth; sh.classList.add("pin-shake");
      }
      function checkPin(){
        if (pinBusy) return;
        pinBusy = true;
        apiPost("login", { pin: pinEntry }).then(function(d){
          pinBusy = false;
          if (d.ok) showAdmin();
          else pinFail();
        }).catch(function(err){
          pinBusy = false;
          var msg = err && err.message ? err.message : "";
          if (msg === "PIN 唔啱"){ pinFail(); return; }
          pinEntry = ""; renderPin();
          $("pin-err").textContent = (msg.indexOf("HTTP") === 0 || msg === "") ? "連唔到伺服器，請檢查網絡再試。" : msg;
        });
      }
      function pinKey(k){
        if (pinBusy) return;
        $("pin-err").textContent = "";
        if (pinEntry.length < 4) pinEntry += k;
        renderPin();
        if (pinEntry.length === 4) checkPin();
      }
      $("pinpad").addEventListener("click", function(e){
        var t = e.target;
        if (t.dataset && t.dataset.pin) pinKey(t.dataset.pin);
      });
      $("pin-del").addEventListener("click", function(){ if (!pinBusy){ pinEntry = pinEntry.slice(0, -1); renderPin(); } });
      $("pin-cancel").addEventListener("click", function(){ location.href = "index.html"; });
      $("gate-close").addEventListener("click", function(){ location.href = "index.html"; });
      $("gate-scrim").addEventListener("click", function(e){ if (e.target === $("gate-scrim")) location.href = "index.html"; });
      document.addEventListener("keydown", function(e){
        if (!$("gate-scrim").classList.contains("open")) return;
        if (/^[0-9]$/.test(e.key)) pinKey(e.key);
        else if (e.key === "Backspace"){ if (!pinBusy){ pinEntry = pinEntry.slice(0, -1); renderPin(); } }
        else if (e.key === "Escape") location.href = "index.html";
      });

      /* ===== 載入酒單 ===== */
      function loadMenu(){
        apiGet("get_menu").then(function(d){
          if (!d.ok || !d.menu) throw new Error("bad menu");
          MENU = d.menu;
          renderCats(); renderAdmin(); fillAddForm();
        }).catch(function(){
          $("admin-list").innerHTML = '<p class="menu-error">載入唔到酒單，請檢查網絡後重新整理呢頁。</p>';
        });
      }
      $("btn-back").addEventListener("click", function(){ location.href = "index.html"; });
      $("lock-admin").addEventListener("click", function(){
        authed = false;
        apiPost("logout", {}).catch(function(){});
        openGate();
      });

      /* 開頁先驗證登入狀態：已登入就直接入管理頁，否則顯示 PIN。
         注意：呢個檢查係非同步嘅，用家可能喺佢返嚟之前已經開始入 PIN，
         所以如果已經登入咗，或者用家入緊 PIN，就唔好再郁個 gate。 */
      apiGet("get_orders").then(function(d){
        if (authed) return;
        if (d.ok) showAdmin();
        else if (pinEntry === "") openGate();
      }).catch(function(){
        if (!authed && pinEntry === "") openGate();
      });
      renderCats(); fillAddForm();
    </script>
  </body>
</html>
