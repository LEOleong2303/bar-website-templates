<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>雞尾酒猜猜看 · SAMPLE BAR 酒桌遊戲</title>
<style>
  :root{
    --bg:#0b0906; --panel:#171310; --panel-2:#201a14; --line:#322a1f; --line-soft:#241d15;
    --gold:#e3c078; --gold-deep:#b8934a; --gold-ink:#1a1409;
    --cream:#f5efe0; --muted:#b8ab8f; --faint:#8a7d63; --ok:#9dc08b; --bad:#d98a7a; --radius:14px;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height:1.55; padding-bottom:env(safe-area-inset-bottom);
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; min-height:2.75rem; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px 40px; }
  .topbar{ display:flex; align-items:center; gap:12px; padding:14px 0 6px; }
  .topbar .back{ color:var(--muted); text-decoration:none; font-size:14px; white-space:nowrap; }
  .topbar .back:active{ color:var(--gold); }
  .brand{
    margin-left:auto; text-align:right; font-family:"Songti TC", "PMingLiU", serif;
    font-weight:700; letter-spacing:.14em; font-size:13px; white-space:nowrap;
  }
  .brand small{ display:block; font-family:system-ui, sans-serif; font-weight:500; letter-spacing:.32em; font-size:8px; color:var(--gold); }
  header{ padding:14px 0 4px; }
  header h1{ font-family:"Songti TC", "PMingLiU", serif; font-size:24px; font-weight:700; margin:0 0 4px; }
  header h1 span{ color:var(--gold); }
  header p{ margin:0; color:var(--muted); font-size:14px; }
  .progress{ display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-top:16px; }
  .progress b{ color:var(--gold); }
  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 16px; margin-top:10px; text-align:center;
  }
  .qcard .lbl{ color:var(--faint); font-size:12px; letter-spacing:.18em; }
  .qcard .ing{ font-family:"Songti TC", "PMingLiU", serif; font-size:21px; font-weight:700; color:var(--gold); margin:8px 0 2px; line-height:1.5; }
  .qcard .ask{ color:var(--muted); font-size:14px; margin:0; }
  .opts{ display:grid; gap:10px; margin-top:14px; }
  .opt{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; font-size:16px; font-weight:700; text-align:left;
  }
  .opt:active{ border-color:var(--gold); }
  .opt:disabled{ opacity:1; }
  .opt.correct{ border-color:var(--ok); color:var(--ok); background:var(--panel-2); }
  .opt.wrong{ border-color:var(--bad); color:var(--bad); opacity:.75; }
  .feedback{ min-height:28px; text-align:center; font-size:15px; font-weight:700; margin-top:14px; }
  .feedback.good{ color:var(--ok); }
  .feedback.bad{ color:var(--bad); }
  .btn-row{ display:flex; gap:10px; margin-top:8px; }
  .btn-gold{
    flex:1; background:var(--gold); color:var(--gold-ink); font-weight:700; font-size:16px;
    border-radius:12px; padding:13px 10px;
  }
  .btn-gold:active{ background:var(--gold-deep); }
  .btn-gold:disabled{ opacity:.45; }
  .score-big{ font-family:"Songti TC", "PMingLiU", serif; font-size:56px; font-weight:700; color:var(--gold); line-height:1.1; }
  .score-big small{ font-size:24px; color:var(--muted); }
  .hidden{ display:none !important; }
  .foot-note{ color:var(--faint); font-size:12.5px; text-align:center; padding:26px 0 0; margin:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← 酒桌遊戲</a>
    <div class="brand">範例酒吧<small>SAMPLE BAR</small></div>
  </div>
  <header>
    <h1>雞尾酒<span>猜猜看</span></h1>
    <p>睇住成份，估返係邊杯酒。十題一局，全部都係餐牌上面嘅真酒。</p>
  </header>

  <div id="game">
    <div class="progress"><span id="qpos">第 1 / 10 題</span><span>答啱 <b id="score">0</b> 題</span></div>
    <div class="qcard">
      <div class="lbl">成份</div>
      <div class="ing" id="ing"></div>
      <p class="ask">呢杯係咩酒？</p>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="btn-row">
      <button type="button" class="btn-gold" id="next" disabled>下一題</button>
    </div>
  </div>

  <div id="done" class="hidden">
    <div class="qcard">
      <div class="lbl">你嘅成績</div>
      <div class="score-big"><span id="final-score">0</span><small> / 10</small></div>
      <p class="ask" id="verdict"></p>
    </div>
    <div class="btn-row" style="margin-top:14px">
      <button type="button" class="btn-gold" id="again">再玩一次</button>
    </div>
  </div>

  <p class="foot-note">理性飲酒，未成年請勿飲酒。飲酒後請勿駕駛。</p>
</div>
<script>
(function(){
  "use strict";
  /* 酒單資料：酒名 + 英文成份行，照餐牌原文。 */
  var DRINKS = [{"name": "自由古巴", "ing": "Rum · Cola · Lime"}, {"name": "金菲士", "ing": "Gin · Lemon Juice · Syrup · Soda"}, {"name": "莫吉托", "ing": "Rum · Mint · Lime · Soda"}, {"name": "Highball", "ing": "Whisky · Soda"}, {"name": "金湯力", "ing": "Gin · Tonic"}, {"name": "涼夏微醺 · 檸檬梅子 High", "ing": "Vodka · Tonic · Lemon · Plum"}, {"name": "威士忌酸", "ing": "Whisky · Lemon Juice · Syrup"}, {"name": "百萬大道", "ing": "Bourbon · Triple Sec · Grenadine"}, {"name": "Screwdriver", "ing": "Vodka · Orange Juice"}, {"name": "Aperol Spritz", "ing": "Aperol · Prosecco · Soda"}, {"name": "Gin sour", "ing": "Gin · Lemon Juice · Syrup"}, {"name": "Godfather", "ing": "Whisky · Amaretto"}, {"name": "菠蘿酸特調", "ing": "Tequila · Rum · Pineapple"}, {"name": "龍舌蘭日出", "ing": "Tequila · Orange Juice · Grenadine"}, {"name": "長島冰茶", "ing": "Vodka · Gin · Rum · Tequila · Cola"}, {"name": "蘋果肉桂熱紅酒", "ing": "Red Wine · Apple · Cinnamon"}, {"name": "B52", "ing": "Kahlúa · Baileys · Grand Marnier"}, {"name": "瑪格麗特", "ing": "Tequila · Triple Sec · Lime"}, {"name": "梅酒菠蘿氣泡雞尾酒", "ing": "Plum Wine · Pineapple Juice · Soda"}, {"name": "藍色夏威夷", "ing": "Rum · Blue Curaçao · Pineapple"}, {"name": "黑加侖特調", "ing": "House Spirit · Blackcurrant"}, {"name": "菠蘿特調", "ing": "House Spirit · Pineapple"}, {"name": "檸檬特調", "ing": "House Spirit · Lemon"}, {"name": "柚子特調", "ing": "House Spirit · Pomelo"}, {"name": "香橙特調", "ing": "House Spirit · Orange"}, {"name": "大檸樂", "ing": "Lemon · Cola"}, {"name": "檸檬薄荷氣泡水", "ing": "Lemon · Mint · Soda"}, {"name": "冷壓菠蘿汁", "ing": "Cold-pressed Pineapple"}, {"name": "心想事橙氣泡水", "ing": "Orange · Soda"}, {"name": "檸檬蜂蜜柚子茶", "ing": "Lemon · Honey · Yuzu Tea"}, {"name": "一口鮮檸檬汁", "ing": "Fresh Lemon Juice"}, {"name": "有氣檸賓", "ing": "Lemon · Soda"}, {"name": "熱檸檬紅茶 解酒特調", "ing": "Hot Lemon · Black Tea"}, {"name": "落日（無酒精）", "ing": "Orange"}, {"name": "柚點芫荽", "ing": "Grapefruit · Coriander · Chang Soda"}, {"name": "泰式莫吉托", "ing": "Mint · Lime · Chang Soda"}, {"name": "桔爆橙", "ing": "Orange · Chang Soda"}, {"name": "南洋菠蘿", "ing": "Pineapple · Chang Soda"}, {"name": "西洋菜蜜特調", "ing": "Vodka · Lemon · Cucumber · Watercress Honey"}, {"name": "西洋菜蜜特調（無酒精）", "ing": "Watercress Honey · Lemon · Cucumber · Soda"}, {"name": "300%勁唂咕", "ing": "Cocoa"}, {"name": "愛爾蘭唂咕", "ing": "Whisky · Cocoa"}];
  var ROUND = 10;
  var questions = [], qi = 0, score = 0, answered = false;
  function $(id){ return document.getElementById(id); }
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function startRound(){
    var idx = shuffle(DRINKS.map(function(d, i){ return i; })).slice(0, ROUND);
    questions = idx.map(function(i){ return DRINKS[i]; });
    qi = 0; score = 0; answered = false;
    $("done").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("score").textContent = "0";
    render();
  }
  function render(){
    var q = questions[qi];
    $("qpos").textContent = "第 " + (qi + 1) + " / " + ROUND + " 題";
    $("ing").textContent = q.ing;
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("next").disabled = true;
    $("next").textContent = (qi === ROUND - 1) ? "睇成績" : "下一題";
    var others = shuffle(DRINKS.filter(function(d){ return d.name !== q.name; })).slice(0, 3);
    var opts = shuffle([q].concat(others));
    var box = $("opts");
    box.innerHTML = "";
    opts.forEach(function(d){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.textContent = d.name;
      b.addEventListener("click", function(){ answer(b, d.name === q.name, q.name); });
      box.appendChild(b);
    });
  }
  function answer(btn, ok, correctName){
    if (answered) return;
    answered = true;
    var btns = $("opts").querySelectorAll(".opt");
    btns.forEach(function(b){ b.disabled = true; if (b.textContent === correctName) b.classList.add("correct"); });
    var fb = $("feedback");
    if (ok){
      score++;
      $("score").textContent = String(score);
      fb.textContent = "答啱！";
      fb.className = "feedback good";
    } else {
      btn.classList.add("wrong");
      fb.textContent = "錯咗，正確答案係「" + correctName + "」。";
      fb.className = "feedback bad";
    }
    $("next").disabled = false;
  }
  $("next").addEventListener("click", function(){
    if (!answered) return;
    answered = false;
    qi++;
    if (qi >= ROUND){
      $("game").classList.add("hidden");
      $("done").classList.remove("hidden");
      $("final-score").textContent = String(score);
      var v = score >= 9 ? "勁！你根本就係調酒師。" :
              score >= 7 ? "好嘢，識飲識估。" :
              score >= 5 ? "一半一半，飲多幾杯就識。" :
                           "唔緊要，飲返杯先，再估過。";
      $("verdict").textContent = v;
    } else {
      render();
    }
  });
  $("again").addEventListener("click", startRound);
  startRound();
})();
</script>
</body>
</html>
