<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>大話骰 · SAMPLE BAR 酒桌遊戲</title>
<style>
  :root{
    --bg:#0b0906; --panel:#171310; --panel-2:#201a14; --line:#322a1f; --line-soft:#241d15;
    --gold:#e3c078; --gold-deep:#b8934a; --gold-ink:#1a1409;
    --cream:#f5efe0; --muted:#b8ab8f; --faint:#8a7d63; --radius:14px;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height:1.55; padding-bottom:env(safe-area-inset-bottom);
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; min-height:2.75rem; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px 40px; }
  .topbar{ display:flex; align-items:center; gap:12px; padding:14px 0 6px; }
  .topbar .back{ color:var(--muted); text-decoration:none; font-size:14px; white-space:nowrap; }
  .topbar .back:active{ color:var(--gold); }
  .brand{
    margin-left:auto; text-align:right; font-family:"Songti TC", "PMingLiU", serif;
    font-weight:700; letter-spacing:.14em; font-size:13px; white-space:nowrap;
  }
  .brand small{ display:block; font-family:system-ui, sans-serif; font-weight:500; letter-spacing:.32em; font-size:8px; color:var(--gold); }
  header{ padding:14px 0 4px; }
  header h1{ font-family:"Songti TC", "PMingLiU", serif; font-size:24px; font-weight:700; margin:0 0 4px; }
  header h1 span{ color:var(--gold); }
  header p{ margin:0; color:var(--muted); font-size:14px; }
  .seg{
    display:flex; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:3px; margin-top:16px;
  }
  .seg button{
    flex:1; min-height:2.5rem; padding:0 10px; border-radius:999px;
    font-weight:700; font-size:14px; color:var(--muted);
  }
  .seg button[aria-pressed="true"]{ background:var(--gold); color:var(--gold-ink); }
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 16px; margin-top:14px; text-align:center;
  }
  .panel h2{ font-family:"Songti TC", "PMingLiU", serif; font-size:18px; margin:0 0 4px; }
  .panel .hint{ color:var(--muted); font-size:13px; margin:0 0 16px; }
  .dice-area{
    position:relative; min-height:118px; display:flex; flex-wrap:wrap; gap:10px;
    align-items:center; justify-content:center; padding:12px 0;
  }
  .die{
    width:52px; height:52px; border-radius:12px; background:var(--cream);
    border:1px solid var(--gold-deep);
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:7px;
  }
  .die.small{ width:64px; height:64px; padding:9px; }
  .pip{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .pip i{ display:block; width:9px; height:9px; border-radius:50%; background:#1a1409; }
  .die.small .pip i{ width:11px; height:11px; }
  .cup{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:var(--panel-2); border:1px solid var(--gold); border-radius:var(--radius);
    color:var(--gold); font-family:"Songti TC", "PMingLiU", serif; font-size:22px; font-weight:700;
  }
  .cup small{ font-family:system-ui, sans-serif; font-size:12px; color:var(--muted); font-weight:500; }
  .cup.hidden{ display:none; }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .btn-row button{ flex:1; }
  .btn-gold{
    background:var(--gold); color:var(--gold-ink); font-weight:700; font-size:16px;
    border-radius:12px; padding:12px 10px;
  }
  .btn-gold:active{ background:var(--gold-deep); }
  .btn-gold:disabled{ opacity:.45; }
  .btn-ghost{
    border:1px solid var(--line); color:var(--muted); font-weight:700; font-size:15px;
    border-radius:12px; padding:12px 10px; background:var(--panel);
  }
  .btn-ghost:active{ border-color:var(--gold); color:var(--gold); }
  .btn-ghost:disabled{ opacity:.45; }
  .result{
    margin-top:16px; padding:14px; border:1px dashed var(--line); border-radius:12px;
    font-size:15px; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .result b{ font-size:22px; color:var(--gold); font-family:"Songti TC", "PMingLiU", serif; }
  .result .total{ color:var(--muted); font-size:13px; }
  .hidden{ display:none !important; }
  .foot-note{ color:var(--faint); font-size:12.5px; text-align:center; padding:26px 0 0; margin:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← 酒桌遊戲</a>
    <div class="brand">範例酒吧<small>SAMPLE BAR</small></div>
  </div>
  <header>
    <h1>大話<span>骰</span></h1>
    <p>電子骰盅，唔使帶骰。輪流搖，偷睇自己嘅點數，再同枱估大話骰。</p>
  </header>

  <div class="seg" role="group" aria-label="玩法">
    <button type="button" id="mode-cup" aria-pressed="true">骰盅 · 五粒</button>
    <button type="button" id="mode-789" aria-pressed="false">789 · 兩粒</button>
  </div>

  <!-- 骰盅模式 -->
  <section class="panel" id="panel-cup" aria-label="骰盅">
    <h2>骰盅</h2>
    <p class="hint">撳「搖骰」，五粒骰會匿喺盅入面；想睇自己啲點就撳「偷睇」，睇完記得「蓋好」。</p>
    <div class="dice-area" id="cup-area">
      <div id="cup-dice" style="display:contents"></div>
      <div class="cup" id="cup"><span>骰盅</span><small>撳「偷睇」先睇到</small></div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn-gold" id="roll-cup">搖骰</button>
      <button type="button" class="btn-ghost" id="peek" disabled>偷睇</button>
      <button type="button" class="btn-ghost" id="cover" disabled>蓋好</button>
    </div>
  </section>

  <!-- 789 模式 -->
  <section class="panel hidden" id="panel-789" aria-label="789">
    <h2>789</h2>
    <p class="hint">搖兩粒骰，睇總點數：7 加酒，8 半杯，9 全杯，其他就安全。</p>
    <div class="dice-area" id="dice789"></div>
    <div class="btn-row">
      <button type="button" class="btn-gold" id="roll-789">搖兩粒</button>
    </div>
    <div class="result" id="result789" aria-live="polite">
      <span class="total">未搖過，撳上面開始</span>
    </div>
  </section>

  <p class="foot-note">理性飲酒，未成年請勿飲酒。飲酒後請勿駕駛。</p>
</div>
<script>
(function(){
  "use strict";
  var PIPS = { 1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
  function dieHTML(v, small){
    var cells = "";
    for (var i = 1; i <= 9; i++){
      cells += '<span class="pip">' + (PIPS[v].indexOf(i) !== -1 ? "<i></i>" : "") + "</span>";
    }
    return '<div class="die' + (small ? " small" : "") + '" aria-label="' + v + '點">' + cells + "</div>";
  }
  function roll(n){ var out = []; for (var i = 0; i < n; i++){ out.push(1 + Math.floor(Math.random() * 6)); } return out; }
  function $(id){ return document.getElementById(id); }

  /* ---------- 模式切換 ---------- */
  var modeCup = $("mode-cup"), mode789 = $("mode-789");
  function setMode(m){
    var cup = (m === "cup");
    modeCup.setAttribute("aria-pressed", cup ? "true" : "false");
    mode789.setAttribute("aria-pressed", cup ? "false" : "true");
    $("panel-cup").classList.toggle("hidden", !cup);
    $("panel-789").classList.toggle("hidden", cup);
  }
  modeCup.addEventListener("click", function(){ setMode("cup"); });
  mode789.addEventListener("click", function(){ setMode("789"); });

  /* ---------- 骰盅 ---------- */
  var cupDice = $("cup-dice"), cup = $("cup");
  var peekBtn = $("peek"), coverBtn = $("cover"), rollCupBtn = $("roll-cup");
  var covered = true, rolling = false, current = [1, 2, 3, 4, 5];
  function showDice(vals){ cupDice.innerHTML = vals.map(function(v){ return dieHTML(v, false); }).join(""); }
  function setCovered(c){
    covered = c;
    cup.classList.toggle("hidden", !c);
    peekBtn.disabled = !c || rolling;
    coverBtn.disabled = c || rolling;
  }
  showDice(current);
  rollCupBtn.addEventListener("click", function(){
    if (rolling) return;
    rolling = true; setCovered(true);
    rollCupBtn.disabled = true;
    var ticks = 0;
    var timer = setInterval(function(){
      showDice(roll(5));
      ticks++;
      if (ticks >= 8){
        clearInterval(timer);
        current = roll(5);
        showDice(current);
        rolling = false; rollCupBtn.disabled = false;
        setCovered(true);
      }
    }, 60);
  });
  peekBtn.addEventListener("click", function(){ setCovered(false); });
  coverBtn.addEventListener("click", function(){ setCovered(true); });

  /* ---------- 789 ---------- */
  var dice789 = $("dice789"), result789 = $("result789"), roll789Btn = $("roll-789");
  dice789.innerHTML = dieHTML(1, true) + dieHTML(1, true);
  roll789Btn.addEventListener("click", function(){
    var vals = roll(2);
    dice789.innerHTML = vals.map(function(v){ return dieHTML(v, true); }).join("");
    var total = vals[0] + vals[1];
    var verdict, sub;
    if (total === 7){ verdict = "加酒"; sub = "斟多一杯"; }
    else if (total === 8){ verdict = "半杯"; sub = "飲半杯"; }
    else if (total === 9){ verdict = "全杯"; sub = "飲晒成杯"; }
    else { verdict = "安全"; sub = "唔使飲，下一位"; }
    result789.innerHTML = "<b>" + verdict + "</b><span class=\"total\">總點數 " + total + " · " + sub + "</span>";
  });
})();
</script>
</body>
</html>
