<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>轉盤 · SAMPLE BAR 酒桌遊戲</title>
<style>
  :root{
    --bg:#0b0906; --panel:#171310; --panel-2:#201a14; --line:#322a1f; --line-soft:#241d15;
    --gold:#e3c078; --gold-deep:#b8934a; --gold-ink:#1a1409;
    --cream:#f5efe0; --muted:#b8ab8f; --faint:#8a7d63; --radius:14px;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height:1.55; padding-bottom:env(safe-area-inset-bottom);
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; min-height:2.75rem; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px 40px; }
  .topbar{ display:flex; align-items:center; gap:12px; padding:14px 0 6px; }
  .topbar .back{ color:var(--muted); text-decoration:none; font-size:14px; white-space:nowrap; }
  .topbar .back:active{ color:var(--gold); }
  .brand{
    margin-left:auto; text-align:right; font-family:"Songti TC", "PMingLiU", serif;
    font-weight:700; letter-spacing:.14em; font-size:13px; white-space:nowrap;
  }
  .brand small{ display:block; font-family:system-ui, sans-serif; font-weight:500; letter-spacing:.32em; font-size:8px; color:var(--gold); }
  header{ padding:14px 0 4px; text-align:center; }
  header h1{ font-family:"Songti TC", "PMingLiU", serif; font-size:24px; font-weight:700; margin:0 0 4px; }
  header h1 span{ color:var(--gold); }
  header p{ margin:0; color:var(--muted); font-size:14px; }
  .wheel-box{ position:relative; width:340px; max-width:100%; margin:18px auto 0; }
  .wheel-box canvas{ display:block; width:100%; height:auto; }
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent;
    border-top:26px solid var(--gold); filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  .hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%;
    background:var(--bg); border:2px solid var(--gold); color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:"Songti TC", "PMingLiU", serif; font-weight:700; font-size:13px; letter-spacing:.05em;
    pointer-events:none; text-align:center; line-height:1.3;
  }
  .btn-row{ display:flex; gap:10px; margin-top:20px; }
  .btn-gold{
    flex:1; background:var(--gold); color:var(--gold-ink); font-weight:700; font-size:17px;
    border-radius:12px; padding:13px 10px;
  }
  .btn-gold:active{ background:var(--gold-deep); }
  .btn-gold:disabled{ opacity:.45; }
  .result{
    margin-top:16px; padding:18px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel); text-align:center; min-height:96px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .result b{ font-size:26px; color:var(--gold); font-family:"Songti TC", "PMingLiU", serif; }
  .result .sub{ color:var(--muted); font-size:14px; }
  .foot-note{ color:var(--faint); font-size:12.5px; text-align:center; padding:26px 0 0; margin:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← 酒桌遊戲</a>
    <div class="brand">範例酒吧<small>SAMPLE BAR</small></div>
  </div>
  <header>
    <h1><span>轉盤</span></h1>
    <p>撳下面轉一轉，命運話你知今輪要做咩。</p>
  </header>
  <div class="wheel-box">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="680" height="680" aria-label="轉盤，八格：飲半杯、飲一杯、指定一個人飲、全枱乾杯、免罰一次、唱一首歌、講個秘密、再轉一次"></canvas>
    <div class="hub" aria-hidden="true">轉盤</div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn-gold" id="spin">轉！</button>
  </div>
  <div class="result" id="result" aria-live="polite">
    <span class="sub">未轉過，撳「轉！」開始</span>
  </div>
  <p class="foot-note">理性飲酒，未成年請勿飲酒。飲酒後請勿駕駛。</p>
</div>
<script>
(function(){
  "use strict";
  var SEGMENTS = [
    { label: "飲半杯", sub: "飲半杯" },
    { label: "飲一杯", sub: "飲成杯" },
    { label: "指定一個人飲", sub: "你話事，揀一個人飲" },
    { label: "全枱乾杯", sub: "大家一齊舉杯" },
    { label: "免罰一次", sub: "呢輪唔使做" },
    { label: "唱一首歌", sub: "即刻唱幾句" },
    { label: "講個秘密", sub: "講個真嘅秘密出嚟" },
    { label: "再轉一次", sub: "命運未決定，再轉" }
  ];
  var N = SEGMENTS.length;
  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var SIZE = 680, C = SIZE / 2, R = SIZE / 2 - 8;
  var GOLD = "#e3c078", GOLD_DEEP = "#b8934a", DARK = "#201a14", INK = "#1a1409";
  var rotation = 0, spinning = false;

  function draw(){
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.save();
    ctx.translate(C, C);
    ctx.rotate(rotation);
    for (var i = 0; i < N; i++){
      var a0 = (i / N) * Math.PI * 2;
      var a1 = ((i + 1) / N) * Math.PI * 2;
      var goldSeg = (i % 2 === 0);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0, a1);
      ctx.closePath();
      ctx.fillStyle = goldSeg ? GOLD : DARK;
      ctx.fill();
      ctx.strokeStyle = GOLD_DEEP;
      ctx.lineWidth = 2;
      ctx.stroke();
      /* 標籤：沿半徑方向寫 */
      var mid = (a0 + a1) / 2;
      ctx.save();
      ctx.rotate(mid);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "600 26px system-ui, 'PingFang TC', 'Microsoft JhengHei', sans-serif";
      ctx.fillStyle = goldSeg ? INK : GOLD;
      ctx.fillText(SEGMENTS[i].label, R * 0.62, 0);
      ctx.restore();
    }
    ctx.restore();
    /* 外圈 */
    ctx.beginPath();
    ctx.arc(C, C, R, 0, Math.PI * 2);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 5;
    ctx.stroke();
  }
  function resultIndex(){
    var pointer = -Math.PI / 2;
    var local = (pointer - rotation) % (Math.PI * 2);
    if (local < 0) local += Math.PI * 2;
    return Math.floor(local / (Math.PI * 2 / N));
  }
  var spinBtn = document.getElementById("spin");
  var resultEl = document.getElementById("result");
  spinBtn.addEventListener("click", function(){
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.innerHTML = '<span class="sub">轉緊…</span>';
    var start = rotation;
    var turns = (5 + Math.random() * 2) * Math.PI * 2;
    var extra = Math.random() * Math.PI * 2;
    var target = start + turns + extra;
    var dur = 4200, t0 = null;
    function frame(t){
      if (t0 === null) t0 = t;
      var p = Math.min((t - t0) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 4);
      rotation = start + (target - start) * eased;
      draw();
      if (p < 1){
        requestAnimationFrame(frame);
      } else {
        rotation = target % (Math.PI * 2);
        draw();
        var seg = SEGMENTS[resultIndex()];
        resultEl.innerHTML = "<b>" + seg.label + "</b><span class=\"sub\">" + seg.sub + "</span>";
        spinning = false;
        spinBtn.disabled = false;
      }
    }
    requestAnimationFrame(frame);
  });
  draw();
})();
</script>
</body>
</html>
